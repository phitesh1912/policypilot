services:
  - type: web
    name: policypilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard; never commit it
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REFUSAL_THRESHOLD
        value: "0.02"
      - key: CONTEXT_BUDGET_TOKENS
        value: "1800"
