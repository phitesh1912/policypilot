services:
  - type: web
    name: policypilot
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq # free: Groq chat + local fastembed vectors. Alternatives: gemini | openai | fake
      - key: GROQ_API_KEY
        sync: false # set in the Render dashboard; never commit it
      - key: FASTEMBED_CACHE_DIR
        value: /opt/fastembed # model baked into the image at build time
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REFUSAL_THRESHOLD
        value: "0.02"
      - key: CONTEXT_BUDGET_TOKENS
        value: "1800"
